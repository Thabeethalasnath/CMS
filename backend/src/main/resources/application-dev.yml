spring:
  flyway:
    out-of-order: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-migration}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

