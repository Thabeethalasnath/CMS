server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}&prepareThreshold=0}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 45000
      max-lifetime: 60000
      keepalive-time: 30000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"
      - "*:ignored"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Security & Application Settings
app:
  mail:
    from-email: ${SMTP_FROM_EMAIL:no-reply@kalpanaaa.in}
    from-name: ${SMTP_FROM_NAME:Kalpanaaa Security}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    admin:
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      password-hash: ${ADMIN_PASSWORD_HASH:}
      display-name: ${ADMIN_DISPLAY_NAME:}
    otp:
      hmac-secret: ${OTP_HMAC_SECRET:c3VwZXItc2VjcmV0LW90cC1obWFjLWtleS1mb3ItY21zLXBvcnRhbC0yMDI2}
      expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
      cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
      hourly-limit: ${OTP_HOURLY_LIMIT:5}
