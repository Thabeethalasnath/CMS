server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}&prepareThreshold=0}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 45000
      max-lifetime: 60000
      keepalive-time: 30000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-migration}
    ignore-migration-patterns: "*:missing"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Security & Application Settings
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
